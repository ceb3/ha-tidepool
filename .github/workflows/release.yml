name: Release

# Pushing a tag such as v0.1.0 publishes a GitHub release with the integration
# as tidepool.zip. HACS installs from the tag itself, so hacs.json does not set
# zip_release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the manifest version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("custom_components/tidepool/manifest.json"))["version"])')
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match manifest version $version" >&2
            exit 1
          fi

      - name: Create tidepool.zip
        run: |
          cd custom_components/tidepool
          zip -r "$GITHUB_WORKSPACE/tidepool.zip" . -x "__pycache__/*" "*/__pycache__/*" "*.pyc"

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" tidepool.zip \
            --verify-tag \
            --title "$TAG" \
            --generate-notes
